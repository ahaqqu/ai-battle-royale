[package]
name = "abr-server"
description = "Match gateway + ladder: bot WebSocket hosting, match queue, ELO, replay store"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
abr-core = { path = "../abr-core" }
axum = { version = "0.8", features = ["ws", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync", "time", "signal"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tower-http = { version = "0.6", features = ["fs"] }
clap = { version = "4", features = ["derive"] }
# Match seeds: the one secret of a match must not be derivable from wall time.
getrandom = "0.2"

[dev-dependencies]
tempfile = "3"
# E2E stall test: shrink a client socket's receive buffer.
socket2 = "0.6"
