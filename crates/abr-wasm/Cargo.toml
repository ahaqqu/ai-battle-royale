[package]
name = "abr-wasm"
description = "WASM bindings for the abr-core sim: powers the in-browser replay viewer (PLAN §7.1)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
abr-core = { path = "../abr-core" }
wasm-bindgen = "0.2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }

