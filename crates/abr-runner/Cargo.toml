[package]
name = "abr-runner"
description = "Local runner CLI: run reference-bot matches headless, write + verify replays"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "abr-runner"
path = "src/main.rs"

[dependencies]
abr-core = { path = "../abr-core" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
