[package]
name = "gunbatte-node"
description = "Node seam: the entrant handoff and ladder database shared by the matchmaker and game-server roles"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
gunbatte-core = { path = "../gunbatte-core" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
tempfile = "3"
