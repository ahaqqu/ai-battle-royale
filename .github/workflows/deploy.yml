# Deploy — push-to-deploy for the game + website.
#
# Fires AFTER the CI workflow finishes green on main (or on a manual dispatch),
# then runs the exact same provision/vps/deploy.sh a human would: build viewer
# + server, rsync to the VPS, restart gunbatte.service. One deploy path for
# CI and humans.
#
# One-time setup (before this workflow can succeed):
#   1. ssh-keygen -t ed25519 -f ~/.ssh/gunbatte-deploy -N "" -C "gunbatte-vps-deploy-key"
#   2. run provision/vps/deploy.sh --bootstrap once — it installs the public
#      half into kajianq-deploy's authorized_keys on the VPS (add-only;
#      kajianq's own key line is kept)
#   3. ssh-keyscan 62.83.35.220   # → GitHub secret VPS_KNOWN_HOSTS
#   4. GitHub → Settings → Secrets and variables → Actions:
#        VPS_DEPLOY_SSH_KEY = contents of ~/.ssh/gunbatte-deploy (the PRIVATE key)
#        VPS_KNOWN_HOSTS    = output of step 3
#      Repository VARIABLES (optional, with the defaults shown):
#        VPS_USER           = kajianq-deploy        (the restricted deploy identity)
#        GUNBATTE_GAME_HOST = play.gunbatte.ahaqqu.com
#   5. the sudoers drop-in from deploy.sh --bootstrap makes the final restart
#      passwordless; until that first bootstrap the job only uploads artifacts
#      and prints a reminder.
name: deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      GUNBATTE_DEPLOY_USER: ${{ vars.VPS_USER || 'kajianq-deploy' }}
      GUNBATTE_SSH: ${{ vars.VPS_USER || 'kajianq-deploy' }}@62.83.35.220
      GUNBATTE_GAME_HOST: ${{ vars.GUNBATTE_GAME_HOST || 'play.gunbatte.ahaqqu.com' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        # Official installer (jetli/wasm-pack-action 404s on 'latest' — it
        # builds a doubled-v release URL). Installs into ~/.cargo/bin, which
        # rust-cache persists.
        run: curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/deploy_key

      - name: Deploy (build + upload + restart)
        run: ./provision/vps/deploy.sh
