# provision/vps/nginx/gunbatte.conf — GUNBATTE ROYALE reverse proxy.
#
# A self-contained, add-only site file: it never touches the other apps'
# server blocks. nginx picks blocks by Host header, so kajianq.conf and this
# file coexist on the same 80/443 listeners without seeing each other.
#
# This template installs HTTP-only server blocks. TLS is added afterwards by
# certbot (`certbot --nginx -d <hosts>`), which edits THIS file in place to
# issue certificates and add the 443 blocks + redirects. For that reason
# apply.sh refuses to re-install this file once it exists (override with
# GUNBATTE_FORCE_NGINX=1 only if you know certbot's edits are disposable).
#
# Placeholders (__GUNBATTE_*) are substituted by provision/vps/apply.sh.

# WebSocket upgrade for /ws/bot and /ws/spectate: plain requests carry no
# Upgrade header and hit the '' case, which closes the hop-by-hop header —
# exactly what normal proxying wants. The variable name is prefixed to stay
# unique among all site files included at http level.
map $http_upgrade $gunbatte_connection_upgrade {
    default upgrade;
    ''      close;
}

# Abuse limits (issue #37): per-IP ceilings on the WebSocket endpoints, which
# the app deliberately does not do itself — behind this proxy the socket
# address the app sees is 127.0.0.1. Zones live at http level; the variable
# names are prefixed to stay unique among all site files included here.
#   conn: at most 10 concurrent requests per IP (per location counter)
#   req:  at most 10 WS handshakes per minute per IP, burst 20 — reconnect
#         churn and room-code brute-forcing cannot run at connection speed
limit_conn_zone $binary_remote_addr zone=gunbatte_ws_conn:10m;
limit_req_zone  $binary_remote_addr zone=gunbatte_ws_open:10m rate=10r/m;

# --- game: everything proxied to gunbatte-server on loopback ---------------------
# The viewer itself is static, but it is served by the binary together with
# /ws/*, /api/*, /replays/* and /ladder, so one proxy location covers it all.
server {
    listen 80;
    listen [::]:80;
    server_name __GUNBATTE_GAME_HOST__;

    access_log /var/log/nginx/gunbatte.access.log;
    error_log  /var/log/nginx/gunbatte.error.log warn;

    # Inputs are ~200 bytes and nothing here takes uploads; 1m is generous.
    client_max_body_size 1m;

    # WebSocket endpoints: long-lived (per-IP conn ceiling) with throttled
    # handshakes (req ceiling). proxy_read/send_timeout must exceed the
    # app's keepalive cycle so idle-but-alive sockets are not reaped.
    location = /ws/bot {
        limit_conn gunbatte_ws_conn 10;
        limit_req  zone=gunbatte_ws_open burst=20 nodelay;
        proxy_pass http://127.0.0.1:__GUNBATTE_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host      $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $gunbatte_connection_upgrade;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering off;
    }

    location = /ws/spectate {
        limit_conn gunbatte_ws_conn 10;
        limit_req  zone=gunbatte_ws_open burst=20 nodelay;
        proxy_pass http://127.0.0.1:__GUNBATTE_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host      $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $gunbatte_connection_upgrade;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:__GUNBATTE_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host      $host;
        proxy_set_header X-Real-IP $remote_addr;

        # WebSockets: bot gateway + spectate are long-lived connections.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $gunbatte_connection_upgrade;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering off;
    }
}

# --- website: static marketing site served straight from disk ---------------
# The web root is world-readable (/srv/gunbatte/website), NOT inside the
# deploy identity's 0700 home — nginx workers run as www-data and could never
# traverse that home.
server {
    listen 80;
    listen [::]:80;
    server_name __GUNBATTE_SITE_HOST__;

    access_log /var/log/nginx/gunbatte-site.access.log;
    error_log  /var/log/nginx/gunbatte-site.error.log warn;

    root __GUNBATTE_WEB_ROOT__;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
