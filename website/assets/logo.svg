<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="GUNBATTE ROYALE badge">
  <defs>
    <!-- one rising-sun ray, reused by rotation -->
    <path id="ray" d="M256 250 L237 108 A150 150 0 0 1 275 108 Z" fill="#ff5f7e"/>
    <!-- manga shout burst -->
    <polygon id="burst12" points="0,-46 11,-32 28,-40 30,-22 48,-20 38,-6 52,4 36,12 42,30 24,28 20,46 6,34 -8,46 -12,28 -30,30 -24,12 -40,4 -26,-6 -36,-20 -18,-22 -20,-40 -3,-32"/>
  </defs>

  <!-- badge disc + ring -->
  <circle cx="256" cy="256" r="250" fill="#fffdf5" stroke="#3a2c5a" stroke-width="16"/>
  <circle cx="256" cy="256" r="228" fill="none" stroke="#ff5f7e" stroke-width="4" opacity="0.35"/>

  <!-- rising sun -->
  <g opacity="0.16">
    <use href="#ray"/>
    <use href="#ray" transform="rotate(45 256 256)"/>
    <use href="#ray" transform="rotate(90 256 256)"/>
    <use href="#ray" transform="rotate(135 256 256)"/>
    <use href="#ray" transform="rotate(180 256 256)"/>
    <use href="#ray" transform="rotate(225 256 256)"/>
    <use href="#ray" transform="rotate(270 256 256)"/>
    <use href="#ray" transform="rotate(315 256 256)"/>
  </g>

  <!-- crosshair ring + ticks -->
  <circle cx="256" cy="256" r="152" fill="none" stroke="#3a2c5a" stroke-width="3" opacity="0.45"/>
  <g stroke="#3a2c5a" stroke-width="7" stroke-linecap="round" opacity="0.75">
    <line x1="256" y1="92"  x2="256" y2="116"/>
    <line x1="256" y1="396" x2="256" y2="420"/>
    <line x1="92"  y1="256" x2="116" y2="256"/>
    <line x1="396" y1="256" x2="420" y2="256"/>
  </g>

  <!-- ring text -->
  <defs>
    <path id="arcTop" d="M 66,256 A 190,190 0 0 1 446,256"/>
    <path id="arcBot" d="M 51,256 A 205,205 0 0 0 461,256"/>
  </defs>
  <text font-family="'Baloo 2','Trebuchet MS',sans-serif" font-weight="800" font-size="34" letter-spacing="6" fill="#3a2c5a">
    <textPath href="#arcTop" startOffset="50%" text-anchor="middle">GUNBATTE ★ ROYALE</textPath>
  </text>
  <text font-family="'Hiragino Maru Gothic ProN','Yu Gothic','Noto Sans JP',sans-serif" font-weight="800" font-size="30" letter-spacing="10" fill="#ff5fd0">
    <textPath href="#arcBot" startOffset="50%" text-anchor="middle">がんばって！！</textPath>
  </text>

  <!-- candy stars -->
  <g fill="#ffd93b" stroke="#3a2c5a" stroke-width="5" stroke-linejoin="round">
    <path d="M150 132l8 17 19 2.6-14 13.2 3.6 18.8-16.6-9.4-16.6 9.4 3.6-18.8-14-13.2 19-2.6z"/>
    <path d="M118 330l6 13 15 2-11 10.4 2.8 14.8-12.8-7.4-12.8 7.4 2.8-14.8-11-10.4 15-2z"/>
  </g>

  <!-- ===== tarsius: the grumpy sharpshooter ===== -->
  <!-- dish ears (cyan rim / mid blue / purple core) -->
  <g stroke="#3a2c5a" stroke-width="9">
    <circle cx="171" cy="205" r="46" fill="#1fb2e8"/>
    <circle cx="171" cy="205" r="29" fill="#3a41d6" stroke-width="7"/>
    <circle cx="171" cy="205" r="14" fill="#8b3fd9" stroke-width="6"/>
    <circle cx="341" cy="205" r="46" fill="#1fb2e8"/>
    <circle cx="341" cy="205" r="29" fill="#3a41d6" stroke-width="7"/>
    <circle cx="341" cy="205" r="14" fill="#8b3fd9" stroke-width="6"/>
  </g>
  <!-- head -->
  <circle cx="256" cy="280" r="106" fill="#ff5f7e" stroke="#3a2c5a" stroke-width="10"/>
  <!-- cream face mask -->
  <g fill="#f5e7c8">
    <ellipse cx="256" cy="292" rx="86" ry="56"/>
    <ellipse cx="212" cy="262" rx="38" ry="42"/>
    <ellipse cx="300" cy="262" rx="38" ry="42"/>
  </g>
  <!-- fur wedge between the eyes -->
  <polygon points="247,232 265,232 256,258" fill="#ff5f7e"/>
  <!-- big glossy eyes, half-lidded (he is SO tired) -->
  <g stroke="#3a2c5a">
    <circle cx="212" cy="264" r="31" fill="#f7d308" stroke-width="7"/>
    <circle cx="300" cy="264" r="31" fill="#f7d308" stroke-width="7"/>
    <!-- lazy lids: fur-colored caps with a grape lash line -->
    <path d="M 181,254 A 31,31 0 0 1 243,254 Z" fill="#ff5f7e" stroke-width="5"/>
    <path d="M 269,254 A 31,31 0 0 1 331,254 Z" fill="#ff5f7e" stroke-width="5"/>
  </g>
  <circle cx="200" cy="276" r="8" fill="#ffffff"/>
  <circle cx="288" cy="276" r="8" fill="#ffffff"/>
  <circle cx="212" cy="270" r="3.5" fill="#ffffff" opacity="0.9"/>
  <circle cx="300" cy="270" r="3.5" fill="#ffffff" opacity="0.9"/>
  <!-- annoyed brows -->
  <g stroke="#3a2c5a" stroke-width="9" stroke-linecap="round">
    <line x1="182" y1="222" x2="230" y2="234"/>
    <line x1="330" y1="222" x2="282" y2="234"/>
  </g>
  <!-- nose + grumpy frown -->
  <ellipse cx="256" cy="298" rx="10" ry="8" fill="#8b3fd9"/>
  <path d="M234 332 Q256 320 278 332" fill="none" stroke="#3a2c5a" stroke-width="6" stroke-linecap="round"/>

  <!-- ===== jalak: the hype-bird, mid-shout on the ring ===== -->
  <g transform="translate(444 300) rotate(6)">
    <!-- tail fan -->
    <g fill="#fbfdff" stroke="#3a2c5a" stroke-width="5" stroke-linejoin="round">
      <path d="M18 26 Q44 44 40 74 Q22 62 12 40 Z"/>
      <path d="M6 32 Q18 62 6 86 Q-8 66 -8 42 Z"/>
    </g>
    <path d="M6 32 Q18 62 6 86 Q-8 66 -8 42 Z" fill="none"/>
    <path d="M16 66 Q20 78 6 86 Q0 76 -2 62 Z" fill="#25293f"/>
    <!-- legs to the ring -->
    <g stroke="#8d93b5" stroke-width="5" stroke-linecap="round">
      <line x1="-2" y1="18" x2="-4" y2="34"/>
      <line x1="10" y1="18" x2="10" y2="34"/>
    </g>
    <!-- body + wing -->
    <ellipse cx="0" cy="0" rx="27" ry="21" fill="#fbfdff" stroke="#3a2c5a" stroke-width="5"/>
    <path d="M-14 -4 Q6 -16 22 -2 Q10 16 -12 10 Z" fill="#fbfdff" stroke="#3a2c5a" stroke-width="4"/>
    <path d="M14 0 Q22 8 16 16 Q6 10 4 2 Z" fill="#25293f"/>
    <!-- head + crest -->
    <g fill="#fbfdff" stroke="#3a2c5a" stroke-width="4.5" stroke-linejoin="round">
      <path d="M-8 -30 Q-14 -46 -2 -50 Q0 -40 2 -34 Z"/>
      <path d="M-2 -32 Q0 -50 12 -50 Q8 -40 6 -32 Z"/>
      <circle cx="-8" cy="-26" r="17"/>
    </g>
    <!-- cobalt eye patch + eye -->
    <ellipse cx="-14" cy="-28" rx="9.5" ry="7.5" fill="#1e7ff0"/>
    <circle cx="-14" cy="-28" r="4.5" fill="#ffffff"/>
    <circle cx="-15" cy="-28" r="2.2" fill="#25293f"/>
    <!-- shouting beak -->
    <g fill="#d9d2b0" stroke="#3a2c5a" stroke-width="3.5" stroke-linejoin="round">
      <path d="M-24 -30 L-44 -26 L-24 -24 Z"/>
      <path d="M-24 -23 L-40 -16 L-22 -18 Z"/>
    </g>
  </g>

  <!-- GUNBATTE! burst by the beak (kept inside the ring-text radius) -->
  <g transform="translate(368 238) rotate(-10) scale(0.92)">
    <use href="#burst12" fill="#ff5fd0" stroke="#3a2c5a" stroke-width="5" stroke-linejoin="round"/>
    <text x="0" y="7" text-anchor="middle" font-family="'Baloo 2','Trebuchet MS',sans-serif" font-weight="800" font-size="17" fill="#ffffff">GUNBATTE!</text>
  </g>
</svg>
